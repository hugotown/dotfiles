version: 1

paths:
  run_root: ~/.local/state/opencode/daddy/runs
  worktree_root: ~/.local/state/opencode/daddy/worktrees

runtime:
  max_issue_depth: 3
  node_retries: 1
  command_timeout_seconds: 1800
  startup_timeout_seconds: 30
  node_timeout_seconds: 1800
  poll_interval_seconds: 1
  require_idle_status: true

build:
  max_concurrency: 3
  max_items: 32

provisioning:
  copy_env_files: true

git:
  branch_prefix: daddy/wip-
  base_branch: auto
  remote: origin

delivery:
  mode: adaptive
  no_remote: local-branch
  with_remote: pull-request
  draft_pull_request: false

models:
  intent: openai/gpt-5.6-terra
  spec_design: openai/gpt-5.6-terra
  plan: openai/gpt-5.6-terra
  rca: openai/gpt-5.6-terra
  issue_plan: openai/gpt-5.6-terra
  worker_high: openai/gpt-5.6-luna
  worker_mid: minimax/MiniMax-M3
  worker_low: minimax/MiniMax-M2.7-highspeed

nodes:
  intent:
    kind: llm
    outcomes:
      sdlc: spec-design
      issue: issue-rca
      blocked: halt
  spec-design:
    kind: llm
    outcomes:
      success: plan
      blocked: halt
  plan:
    kind: llm
    outcomes:
      success: build
      blocked: halt
  build:
    kind: parallel
    model_by_complexity:
      high: worker_high
      mid: worker_mid
      low: worker_low
    outcomes:
      success: verify
      failure: issue-rca
      blocked: halt
  verify:
    kind: shell
    outcomes:
      success: ship
      failure: issue-rca
      blocked: halt
  issue-rca:
    kind: llm
    outcomes:
      success: issue-plan
      blocked: halt
  issue-plan:
    kind: llm
    outcomes:
      success: issue-build
      blocked: halt
  issue-build:
    kind: parallel
    model_by_complexity:
      high: worker_high
      mid: worker_mid
      low: worker_low
    outcomes:
      success: issue-verify
      failure: issue-rca
      blocked: halt
  issue-verify:
    kind: shell
    outcomes:
      success: ship
      failure: issue-rca
      max-depth: halt
      blocked: halt
  ship:
    kind: shell
    outcomes:
      delivered: delivered
      blocked: halt
